version: 1
bundleID: com.damonj.kinetica
product: Kinetica

# Lives in Support/ rather than xtool/, which is where xtool writes the built
# .app — build output and source config shouldn't share a directory.
infoPath: Support/Info.plist

# A single 1024px PNG — xtool derives the icon set from it, so no asset
# catalog and no macOS-only actool.
iconPath: Kinetica/Resources/AppIcon.png

# Copied into the app bundle root, where UIAppFonts expects to find them.
resources:
  - Kinetica/Resources/Fonts/Fraunces-Medium.ttf
  - Kinetica/Resources/Fonts/Fraunces-SemiBold.ttf
  - Kinetica/Resources/Fonts/OFL.txt
